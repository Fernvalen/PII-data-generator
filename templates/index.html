<!DOCTYPE html>
<html>
    <head>
        <title>PII Synthetic Data Generator</title>
    </head>

    <body>
        <h1>🧪 Synthetic Data Generator</h1>

        <form method="POST">
            <label for="data_type">Data Type:</label>
            <select name="data_type" id="data_type">
                <option value="user_profiles">👤 User Profiles</option>
                <option value="financial_transactions">💳 Financial Transactions</option>
                <option value="healthcare_records">🏥 Healthcare Records</option>
            </select>"

            <label for="count">Record Count:</label>
            <input type="number" name="count" id="count" value="10" min="1" max="100">

            <button type="submit">Generate Data</button>
        </form>

        {% if data %}
            <h2>Results ({{ selected_type }})</h2>
            <table border="1" cellpadding="5">
                <thead>
                    <tr>
                        {% for key in data[0].keys() %}
                            <th>{{ key }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for record in data %}
                        <tr>
                            {% for value in record.values() %}
                                <td>{{ value }}</td>
                            {% endfor %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}
    </body>
</html>
